<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Untitled – English Tutor</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="components.css" />
    <link rel="stylesheet" href="tutor.css" />
    <script src="tutor.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="row">
          <label for="llm-select">LLM:</label>
          <select id="llm-select" disabled>
            <option>No LLM configured</option>
          </select>
          <button id="check" class="primary" type="button" disabled title="Check (Ctrl+Enter)">
            Check
          </button>
          <label class="inline"><input id="auto-check" type="checkbox" /> Auto-check</label>
          <button id="stats" type="button">Stats</button>
          <button id="prefs" type="button">Prefs</button>
        </div>
        <div class="row">
          <button id="new" type="button" disabled>New</button>
          <button id="open" type="button" disabled>Open</button>
          <button id="save" type="button" disabled title="Save (Ctrl+S)">Save</button>
          <button id="save-as" type="button" disabled title="Save As (Ctrl+Shift+S)">
            Save As
          </button>
          <button id="save-to-library" type="button" disabled>Save to library</button>
          <button id="library" type="button" disabled>Library</button>
        </div>
        <div class="row legend">
          <span class="legend-label">Legend:</span>
          <button
            id="legend-grammar"
            class="legend-item"
            data-category="grammar"
            type="button"
            aria-pressed="true"
          >
            <span class="sample sample-grammar">grammar</span>
          </button>
          <button
            id="legend-vocabulary"
            class="legend-item"
            data-category="vocabulary"
            type="button"
            aria-pressed="true"
          >
            <span class="sample sample-vocabulary">vocabulary</span>
          </button>
          <button
            id="legend-syntax"
            class="legend-item"
            data-category="syntax"
            type="button"
            aria-pressed="true"
          >
            <span class="sample sample-syntax">syntax</span>
          </button>
          <span class="spacer"></span>
          <button id="clear" type="button" disabled>Clear</button>
          <button id="copy" type="button" disabled>Copy</button>
        </div>
      </header>

      <main id="panes" class="panes">
        <section class="editor-pane" aria-label="Text editor">
          <div id="banner-host"></div>
          <div id="editor-box" class="editor-box">
            <div id="mirror" class="mirror editor-text" aria-hidden="true"></div>
            <textarea
              id="editor"
              class="editor-text"
              spellcheck="true"
              placeholder="Write or paste your English text here."
            ></textarea>
          </div>
        </section>

        <div
          id="divider-main"
          class="divider divider-x"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize the editor"
          aria-valuemin="30"
          aria-valuemax="85"
          aria-valuenow="65"
          tabindex="0"
        ></div>

        <aside id="side" class="side" aria-label="Results">
          <section id="issues-pane" class="issues-pane" aria-label="Issues"></section>

          <div
            id="divider-side"
            class="divider divider-y"
            role="separator"
            aria-orientation="horizontal"
            aria-label="Resize the issues list"
            aria-valuemin="15"
            aria-valuemax="85"
            aria-valuenow="40"
            tabindex="0"
          ></div>

          <section
            id="explanation"
            class="explanation-pane explanation"
            aria-label="Explanation"
          ></section>
        </aside>
      </main>

      <footer class="status-bar" role="status">
        <span id="status-state">Ready</span>
        <span class="sep">|</span>
        <span id="status-words">0 words</span>
        <span class="sep">|</span>
        <span id="status-tokens">last: none · session: 0 in / 0 out</span>
      </footer>
    </div>
  </body>
</html>
